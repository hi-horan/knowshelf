name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CMD_PATH: ./cmd/knowshelf

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./cmd/knowshelf ./internal/config ./internal/mcp ./internal/search ./internal/segment ./internal/store

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: knowshelf-linux-amd64
            binary: knowshelf
            archive: tar
            extension: tar.gz
          - goos: darwin
            goarch: arm64
            artifact: knowshelf-darwin-arm64
            binary: knowshelf
            archive: tar
            extension: tar.gz
          - goos: windows
            goarch: amd64
            artifact: knowshelf-windows-amd64
            binary: knowshelf.exe
            archive: zip
            extension: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME:-manual}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            version="$(git describe --tags --always --dirty 2>/dev/null || echo manual)"
          fi

          safe_version="${version//\//-}"
          git_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo "$version")"
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "version=${version}"
            echo "safe_version=${safe_version}"
            echo "git_tag=${git_tag}"
            echo "build_time=${build_time}"
          } >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          ldflags="-s -w -X main.gitVersion=${{ steps.version.outputs.version }} -X main.buildTime=${{ steps.version.outputs.build_time }} -X main.gitTag=${{ steps.version.outputs.git_tag }}"

          mkdir -p "dist/${{ matrix.artifact }}"
          go build -trimpath -ldflags "$ldflags" -o "dist/${{ matrix.artifact }}/${{ matrix.binary }}" "$CMD_PATH"

          cp config.example.yaml "dist/${{ matrix.artifact }}/"
          if [ -f README.md ]; then
            cp README.md "dist/${{ matrix.artifact }}/"
          fi

      - name: Package artifact
        run: |
          set -euo pipefail

          package="${{ matrix.artifact }}-${{ steps.version.outputs.safe_version }}.${{ matrix.extension }}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "../${package}" "${{ matrix.artifact }}")
          else
            tar -czf "${package}" -C dist "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.safe_version }}
          path: ${{ matrix.artifact }}-*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail

          (
            cd dist
            sha256sum *.tar.gz *.zip > checksums.txt
          )

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t files < <(find dist -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "checksums.txt" \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release artifacts found" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "Knowshelf $GITHUB_REF_NAME" --generate-notes
          fi
