version: 2

project_name: knowshelf

before:
  hooks:
    - go mod download

builds:
  - id: knowshelf
    main: ./cmd/knowshelf
    binary: knowshelf
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64_v1
      - darwin_arm64
      - windows_amd64_v1
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.gitVersion={{ .Tag }}
        -X main.buildTime={{ .Date }}
        -X main.gitTag={{ .Tag }}

archives:
  - id: knowshelf
    ids:
      - knowshelf
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}-{{ .Tag }}
    wrap_in_directory: true
    files:
      - README.md
      - README-cn.md
      - config.example.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
